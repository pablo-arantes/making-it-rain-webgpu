# A diagnostic, not a lane. Dispatch it by hand when the `gpu` job's worker
# dies, to find out where and why.
#
# 🔴 The `gpu` job in ci.yml gets an adapter on this runner and then the vitest
# worker exits with `Worker exited unexpectedly`, no assertion reached. That
# tells you nothing: vitest forks, so the fault is reported by the parent as a
# dead child, and `skipIf` cannot see a native crash at all. This runs the same
# sequence in one process with no test runner, twice -- plain, to find the
# stage, and under gdb, for the native stack.
name: Dawn crash probe

on:
  workflow_dispatch:
    inputs:
      driver:
        description: "Vulkan driver to install"
        required: false
        default: "mesa-vulkan-drivers"

jobs:
  # 🔴 The same crash happens on **real Apple Silicon**, so it is not llvmpipe's.
  # macOS 15.7.9 and macOS 26.6.2 both load Dawn, both report an `apple`
  # adapter, both create a device, and both die in `checkFixedPointExactness` —
  # the identical call as on Linux. Chrome runs all seven checks on Metal
  # without complaint, so this is Dawn-in-Node, not the kernels.
  # 🔴 Is the segfault a regression in the package? We are pinned to 0.6.0 and
  # 0.6.1 and 0.6.2 exist. Four theories about the crash have died (scale, slot
  # count, second call, destroy) and the minimal reproducer found its own crash
  # on the *first* trivial dispatch — which is the point at which "our usage is
  # wrong" stops being the likely story. A version sweep is cheap and, unlike
  # another bisect, can end in a fix rather than an explanation.
  versions:
    strategy:
      fail-fast: false
      matrix:
        webgpu: ["0.6.0", "0.6.1", "0.6.2", "0.5.0"]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: webgpu@${{ matrix.webgpu }}
        run: npm install --no-save webgpu@${{ matrix.webgpu }}
      - name: Every precision check, on this version
        run: |
          set +e
          MIR_GPU_TESTS=1 node \
            --import ./tools/wgsl-loader.mjs --import tsx \
            tools/dawn-probe.ts
          code=$?
          set -e
          echo "RESULT webgpu@${{ matrix.webgpu }} exit=$code"
          if [ "$code" -eq 0 ]; then echo "::notice::webgpu@${{ matrix.webgpu }} passes every check on Metal"; fi

  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sw_vers
      - name: Minimal reproducer, destroy vs keep
        run: |
          MIR_GPU_TESTS=1 MIR_DAWN_MIN=1 node \
            --import ./tools/wgsl-loader.mjs --import tsx \
            tools/dawn-probe.ts || echo "MIN_EXIT=$?"
      - name: Is it scale or pattern?
        run: |
          MIR_GPU_TESTS=1 MIR_DAWN_MICRO=1 node \
            --import ./tools/wgsl-loader.mjs --import tsx \
            tools/dawn-probe.ts || echo "MICRO_EXIT=$?"

  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vulkan and a debugger
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.driver }} vulkan-tools gdb
      # What the driver actually offers, so the adapter is not a mystery.
      - name: vulkaninfo
        run: vulkaninfo --summary || true
      # Stage 1: no debugger. The last PROBE line is the step that killed it.
      - name: Probe, plain
        run: |
          MIR_GPU_TESTS=1 node \
            --import ./tools/wgsl-loader.mjs --import tsx \
            tools/dawn-probe.ts || echo "EXIT=$?"
      # Stage 2: the same run under gdb. `-batch` so it never waits for input,
      # and every thread's backtrace because the fault may not be on the main
      # one.
      # 🔴 The probe passes everything, so the fault is not the engine, the
      # device path or the driver -- it is something about the runner. vitest
      # runs each test file in a **forked child**, and Dawn's native module
      # spawns threads; these two steps ask which half matters. If `threads`
      # survives where the default `forks` dies, the pool is the answer and the
      # lane can be configured rather than debugged.
      - name: The lane as CI runs it (forks, expected to die)
        run: npm run test:gpu || echo "FORKS_EXIT=$?"
      - name: The same lane in threads (same process, no fork)
        run: |
          MIR_GPU_TESTS=1 node node_modules/vitest/vitest.mjs run \
            test/precision.gpu.test.ts --pool=threads || echo "THREADS_EXIT=$?"
      # 🔴 The bisect. Standalone the sequence completes; under Vitest nothing
      # reports before the signal. This file does *only* the acquisition, with a
      # line before each step, so the last line names the stage. Threads first,
      # because that pool shows the signal instead of hiding it behind a dead
      # child.
      - name: Acquisition only, threads
        run: |
          MIR_GPU_TESTS=1 node node_modules/vitest/vitest.mjs run \
            test/dawn-acquire.gpu.test.ts --pool=threads \
            || echo "ACQUIRE_THREADS_EXIT=$?"
      - name: Acquisition only, forks
        run: |
          MIR_GPU_TESTS=1 node node_modules/vitest/vitest.mjs run \
            test/dawn-acquire.gpu.test.ts --pool=forks \
            || echo "ACQUIRE_FORKS_EXIT=$?"
      # Acquisition passed in both pools, so the checks are next: the same ones
      # that pass standalone on this runner. Threads, so a signal is a signal.
      - name: Each check, under vitest, threads
        run: |
          MIR_GPU_TESTS=1 MIR_DAWN_BISECT=1 node node_modules/vitest/vitest.mjs run \
            test/dawn-acquire.gpu.test.ts --pool=threads \
            || echo "BISECT_THREADS_EXIT=$?"
      - name: Probe, under gdb
        run: |
          MIR_GPU_TESTS=1 gdb -batch \
            -ex 'set confirm off' \
            -ex 'set pagination off' \
            -ex run \
            -ex 'echo \n=== faulting thread ===\n' \
            -ex 'bt full' \
            -ex 'echo \n=== all threads ===\n' \
            -ex 'thread apply all bt' \
            --args "$(command -v node)" \
              --import ./tools/wgsl-loader.mjs --import tsx \
              tools/dawn-probe.ts || echo "GDB_EXIT=$?"
