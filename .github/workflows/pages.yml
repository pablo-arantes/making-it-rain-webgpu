name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Opt-in, so a push cannot deploy something experimental by surprise.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.MIR_AUTO_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # MIR_PUBLIC drops `validate.html`, which is a development tool that
      # fetches generated fixtures and would be a page of 404s on the site.
      - name: Build for the repository subpath Pages serves from
        run: MIR_BASE="/${GITHUB_REPOSITORY#*/}/" MIR_PUBLIC=1 npm run build:web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
