name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 🔴 That the install fetched its *platform binaries*, which is a separate
      # question from whether it succeeded. npm 11 blocks install scripts unless
      # `allowScripts` in package.json names them, and that block lists exact
      # versions (`esbuild@0.28.2`, `webgpu@0.6.0`) -- so a lockfile bump makes
      # the entries stale, the binaries are silently not fetched, and Vite and
      # Vitest do not run at all. This runner pins Node 22, whose npm 10 has no
      # `allowScripts` and runs the scripts regardless, so CI currently passes
      # for a different reason than a developer machine does. One day it will
      # not, and this turns that into a named failure rather than a confusing
      # one.
      - name: The install fetched its platform binaries
        run: npx vite --version && npx vitest --version
      # Typecheck, the unit and reference lanes, and the web build. No GPU
      # needed, which is the point: this must stay runnable anywhere.
      - run: npm run check

  gpu:
    # The kernels on a non-Apple WebGPU implementation — the one piece of
    # evidence this project could not get from a developer machine, since no
    # published Dawn binary loads on macOS 14.
    #
    # 🔴 **It runs `tools/dawn-probe.ts`, not `npm run test:gpu`, and that is a
    # measured choice.** The Vitest lane **segfaults** here: bisected to the
    # first check, with a Dawn device already created and the kernel graph
    # already imported, in both the `forks` and `threads` pools — `exit 139`.
    # The identical checks, on the identical adapter, **pass** standalone. So
    # the fault is Vitest's worker next to llvmpipe, not the engine, and the
    # lane is unusable here while the probe is not.
    #
    # The probe exits non-zero if any check fails, so this is a real gate:
    # `continue-on-error` is gone, and a differential failure on a non-Apple
    # implementation now fails the build. A runner with no adapter at all
    # reports that and exits 0, which is the one thing the Vitest lane got
    # right.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
      - run: vulkaninfo --summary || true
      - name: Every precision check, through Dawn
        run: |
          MIR_GPU_TESTS=1 node \
            --import ./tools/wgsl-loader.mjs --import tsx \
            tools/dawn-probe.ts

  browser:
    # 🔴 Still allowed to fail, and unlike the Dawn lane above that is not
    # laziness: these specs do **not** degrade when there is no device.
    # `checks.spec.ts` skips loudly when the browser exposes no `navigator.gpu`
    # at all, but the other five -- bonded, run, prepare, analyse, profile --
    # assert against OpenMM and will fail hard. Removing the guard needs the
    # same skip in all of them, and more importantly needs somebody to look at
    # what a *software* adapter actually reports: nobody has, so failing the
    # build on lavapipe would be a guess. Retire this by running the job once
    # and reading it.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
      # 🔴 Untested from here. A hosted runner has no GPU, so WebGPU has to come
      # from Mesa's lavapipe through Vulkan, and Chrome needs to be told to
      # allow a software adapter. These flags are the documented way to ask;
      # whether Dawn then grants a device, and what `isFallback` and the
      # precision checks say if it does, is unknown and is the whole point of
      # running this once. `vulkaninfo` first, so the log says whether Vulkan
      # was there at all before Chrome is blamed.
      - run: vulkaninfo --summary || true
      - run: npm run test:browser
        env:
          MIR_CHROME_SOFTWARE: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  oracle:
    # The Python side: regenerate the committed fixtures and check that the
    # numbers docs/ quotes are still the numbers OpenMM produces.
    #
    # 🔴 Allowed to fail because it reaches the network: `build_reference_system`
    # fetches 1L2Y from RCSB, and an outage there is not a regression here. The
    # assertions themselves are deterministic and would be worth failing on, so
    # the right fix is to separate the download from the comparison rather than
    # to keep excusing both. Until then a red tick here means "look", not
    # "broken".
    #
    # 🔴 It uses `tools/environment-ci.yml`, not the full oracle environment:
    # `mamba` **could not solve** the latter on linux-64, and this path needs
    # only openmm, pdbfixer and numpy. Making that true also meant moving
    # `build_reference_system`'s openff and openmmforcefields imports into its
    # ligand branch, where they belong — a protein-only run was dragging in
    # AmberTools through GAFF for nothing.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: tools/environment-ci.yml
          activate-environment: mir-oracle
          miniforge-version: latest
      - name: Rebuild the Trp-cage fixture and compare with the committed facts
        shell: bash -el {0}
        run: |
          python tools/build_reference_system.py --pdb-id 1L2Y --out /tmp/fixtures
          python - <<'PY'
          import json
          new = json.load(open("/tmp/fixtures/1L2Y/facts.json"))
          old = json.load(open("docs/measurements/1L2Y-facts.json"))
          # Atom counts and PME parameters are deterministic; hydrogen
          # positions are not (see docs/NOTEBOOK_PARITY.md finding 2), so the
          # box and water count are allowed to move a little.
          assert new["pme"] == old["pme"], (new["pme"], old["pme"])
          assert new["forces"][0]["numBonds"] == old["forces"][0]["numBonds"]
          box_new, box_old = new["box_nm"][0][0], old["box_nm"][0][0]
          assert abs(box_new - box_old) < 0.1, (box_new, box_old)
          print("fixture agrees with the committed facts")
          PY
